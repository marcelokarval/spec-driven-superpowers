name: ASDS Validation CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: '20.19.0'
          - os: ubuntu-latest
            node: '22'
          - os: ubuntu-latest
            node: '24'
          - os: windows-latest
            node: '24'
          - os: macos-latest
            node: '24'
    runs-on: ${{ matrix.os }}
    env:
      OPENSPEC_TELEMETRY: '0'
      OPENSPEC_NO_UPDATE_CHECK: '1'
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run validate
      - run: npm test
      - name: Bash wrapper syntax
        if: runner.os != 'Windows'
        run: bash -n scripts/install.sh
      - name: PowerShell wrapper preview and error propagation
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $target = Join-Path $env:RUNNER_TEMP "asds-wrapper-preview"
          & ./scripts/install.ps1 --scope project --target $target
          if ($LASTEXITCODE -ne 0) { throw "Preview failed" }
          if (Test-Path $target) { throw "Preview wrote files" }
          & ./scripts/install.ps1 --unknown
          if ($LASTEXITCODE -eq 0) { throw "Unknown flag was accepted" }
          $global:LASTEXITCODE = 0
