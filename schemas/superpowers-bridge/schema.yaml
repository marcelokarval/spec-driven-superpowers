name: superpowers-bridge
version: 1
description: Self-contained planning workflow combining OpenSpec traceability with Superpowers planning and review practices.
artifacts:
  - id: proposal
    generates: proposal.md
    description: Initial proposal document outlining the change and capabilities
    template: proposal.md
    instruction: |
      Create the proposal document that establishes WHY this change is needed.

      Sections:
      - **Why**: 1-2 sentences on the problem or opportunity. What problem does this solve? Why now?
      - **What Changes**: Bullet list of changes. Be specific about new capabilities, modifications, or removals. Mark breaking changes with **BREAKING**.
      - **Capabilities**: Identify which specs will be created or modified (New Capabilities / Modified Capabilities).
      - **Impact**: Affected code, APIs, dependencies, or systems.
    requires: []

  - id: specs
    generates: "specs/**/*.md"
    description: Detailed behavioral specifications with BDD scenarios
    template: spec.md
    instruction: |
      Create specification files that define WHAT the system should do.
      Use RFC 2119 keywords (SHALL / MUST).
      Format requirements with `### Requirement: <name>` and scenarios with `#### Scenario: <name>`.
      Every requirement MUST have at least one scenario.
      Changes use exact level-two headings such as `## ADDED Requirements` and
      `## MODIFIED Requirements`; never use a level-one or main-spec Requirements heading.
      Every scenario names the requirement-specific observable condition with WHEN and THEN.
    requires:
      - proposal

  - id: design
    generates: design.md
    description: Technical architecture and design decisions
    template: design.md
    instruction: |
      Document the technical architecture and "HOW" behind decisions.
      Include context, goals, non-goals, architecture choices, and security considerations.
    requires:
      - proposal

  - id: microcontracts
    generates: "tasks/task-*.md"
    description: Future-work contracts with planning readiness and scenario traceability
    template: task-template.md
    instruction: |
      Distinguish packages from future executable leaf tasks. Decompose broad outcomes
      autonomously within the approved scope; do not cap task count or require new approval
      merely for a more precise plan. Use nodeType, parentId and reviewed task boundary fields.
      Use only as much recursive package hierarchy as the outcome requires. Composition
      and precedence are distinct relations; packages are never executable.
      Decompose the approved design into tasks with one observable outcome each.
      Use exact file paths, dependencies, shared resources and scenario references.
      Fill Outcome, Inputs, Acceptance, Verification and Definition of done sections.
      Give every leaf a stable title. For each dependency, record why the dependent
      outcome cannot start first and the exact artifact/state it consumes in
      dependencyDetails; generic feature proximity is not a dependency. Repeat the
      requiredOutput verbatim in the task body.
      Declare the accountable owner, decisionInputs and resolvesDecisions. Split
      independent decision owners/evidence into separate leaves; bundling multiple
      decisions requires an explicit decisionBundleReason.
      Declare kind and openDecisions. Unresolved material decisions block planning readiness;
      use a bounded investigation task to answer them before scheduling dependent work.
      Keep interfaces and decision ownership explicit. Do not split solely by file count.
      Do not copy sample paths or commands without inspecting the project.
      Validate all contracts, not just the first glob match, with the ASDS validator.
    requires: [specs, design]

  - id: tasks
    generates: tasks.md
    description: Sole planning index linking every future-work contract
    template: tasks.md
    instruction: |
      Index every tasks/task-ID.md as - [ ] [Task ID](tasks/task-ID.md): Title.
      The title must exactly equal the contract title. Keep numeric IDs in strictly
      increasing order and preserve assigned IDs across revisions; append new IDs.
      Dependencies remain in the contracts. Waves are scheduling hints, not concurrency mandates.
      After the ordered inventory, declare each projected wave once as
      `- Wave N: ID, ID`; these declarations must exactly match taskManager.plannedWaves.
      Validate index/contract bijection, planning readiness and scenario coverage before delivery.
      Deliver a new plan with implementation checkboxes open. A later consumer owns progress.
      Do not generate another plan or progress checklist under docs/superpowers.
    requires: [microcontracts]

  - id: summary
    generates: summary.md
    description: Planning delivery summary consolidating revision, reviews, readback and limitations
    template: summary.md
    instruction: |
      Consolidate the planning delivery before return. Record package revision, fidelity and
      quality review evidence, persistence/readback receipt, blockers and limitations.
      State explicitly whether the original request asked for implementation and that ASDS did
      not perform it. Future verification commands are contract data, not executed evidence.
      Distinguish all delivered contracts from the initial execution frontier: ready now,
      waiting on tasks, blocked by decisions/policy, completed, reverse blockers and planned waves.
    requires:
      - tasks

  - id: planning-manifest
    generates: planning-manifest.json
    description: Machine-readable reviewed planning lifecycle and task-manager projection
    template: planning-manifest.json
    instruction: |
      Fill the canonical planning-delivery/1 envelope after task review. Use the exact
      persisted contract inventory and SHA-256 reference hashes. Declare risk domains,
      decision resolvers/blockers and the deterministic taskManager projection. A protected
      domain requires independent review. Set delivered/partial only after planning-store
      readback matches this revision; do not use a prose-only receipt.
      Each projected task must expose waitingOn, blockedBy, reverse blocks, parallelWith
      and serializesWith so a simple queue can honor both precedence and conflicts.
    requires:
      - summary

apply:
  requires: [tasks, planning-manifest]
  tracks: tasks.md
  instruction: |
    Applying future implementation is outside the ASDS planning lifecycle. A separately
    selected consumer MAY use these contracts, Superpowers TDD and scoped verification.
    That consumer owns execution progress and MUST NOT infer implementation authorization
    from planning delivery. ASDS checkboxes remain a planning view unless explicitly imported
    as historical evidence under a compatible consumer contract.
